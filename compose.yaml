# compose.yaml - BUILD das imagens (no PC de desenvolvimento) e execução local.
#
#   docker compose build && docker compose push     # envia para o Docker Hub (hiannyurt)
#   docker compose up -d                            # rodar localmente
#
# No SERVIDOR use compose.servidor.yaml (só baixa as imagens prontas, sem build).
# Configuração no arquivo .env (mesmo diretório). Veja .env.example.

services:
  whatsapp-api:
    build:
      context: ./gateway
      platforms: ["linux/amd64"]   # servidores Linux comuns (x86_64)
    image: hiannyurt/whatsapp-api:1.34.7
    restart: unless-stopped
    environment:
      API_KEY: ${WHATSAPP_API_KEY:?defina WHATSAPP_API_KEY no .env}
      BASE_WEBHOOK_URL: http://localhost:3000/localCallbackExample
      ENABLE_LOCAL_CALLBACK_EXAMPLE: "TRUE"
      # Não precisamos receber mensagens/confirmações: reduz carga e log.
      DISABLED_CALLBACKS: "message|message_ack|message_create|message_reaction|media_uploaded|loading_screen|change_state|contact_changed|chat_removed|chat_archived|unread_count"
      SET_MESSAGES_AS_SEEN: "FALSE"
      RECOVER_SESSIONS: "TRUE"
      ENABLE_SWAGGER_ENDPOINT: "FALSE"
      TZ: America/Cuiaba
    volumes:
      - whatsapp_sessoes:/usr/src/app/sessions   # sessão do WhatsApp sobrevive a reinícios/atualizações
    # Sem "ports": a API do WhatsApp fica acessível só pelo notificador, dentro da rede do compose.

  notificador:
    build:
      context: .
      platforms: ["linux/amd64"]
    image: hiannyurt/sentinela-notificador:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSAPP_API_URL: http://whatsapp-api:3000
    ports:
      - "8100:8100"   # POST /notificar (chamado pelo Sentinela) e GET /saude
    depends_on:
      whatsapp-api:
        condition: service_healthy

volumes:
  whatsapp_sessoes:
